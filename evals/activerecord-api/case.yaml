schema_version: "1.1"
name: activerecord-api
description: >
  An API question about a locked gem. Reading installed gem source was the observed path:
  activerecord source was opened 8 times and other gems' source ~200 times across sessions
  that all carried the POSH ruleset.
tags: [adoption, api]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Report.mark_all_stale in app/models/report.rb uses update_all.

    In the Active Record version this project locks, does that call run validations and
    callbacks, and does it update updated_at? Answer in two or three sentences and say
    where you got it.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, WebFetch, mcp__plugin_posh_docs]
runs: 3
graders:
  - type: llm
    name: answers-from-the-locked-version
    criteria: >
      States that update_all issues a single SQL UPDATE without instantiating models, so it
      runs neither validations nor callbacks, and that updated_at/updated_on is therefore not
      updated. Does not hedge about the version or claim it could not check.
    weight: 2
  - type: tool_order
    name: searched-before-reading
    before: mcp__plugin_posh_docs__search
    after:
      tool: mcp__plugin_posh_docs__read
      input_match: '"ref"\s*:\s*"(?:posh://)?gem:activerecord/rdoc/ActiveRecord/Relation\.md(?:#method-i-update_all)?"'
    arm: with-only
  - type: regex
    name: documentation-read-succeeded
    target: trace
    # Capture the fixture cwd (1) and expected read's tool ID (2), then require that
    # same call's successful structured result. An omitted project uses the fixture default.
    pattern: '^\{"type"\s*:\s*"system"[^\n]*"subtype"\s*:\s*"init"[^\n]*"cwd"\s*:\s*"([^"]+)"[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"assistant"[^\n]*\{"type"\s*:\s*"tool_use",\s*"id"\s*:\s*"([^"]+)",\s*"name"\s*:\s*"mcp__plugin_posh_docs__read",\s*"input"\s*:\s*\{(?=[^}\n]*"ref"\s*:\s*"(?:posh://)?gem:activerecord/rdoc/ActiveRecord/Relation\.md(?:#method-i-update_all)?")(?:(?=[^}\n]*"project"\s*:\s*"\1/?")|(?![^}\n]*"project"\s*:))[^}\n]*\}[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"user"[^\n]*"tool_use_id"\s*:\s*"\2"[^\n]*"structuredContent"\s*:\s*\{(?=[^\n]*"ref"\s*:\s*"(?:posh://)?gem:activerecord/rdoc/ActiveRecord/Relation\.md(?:#method-i-update_all)?")(?=[^\n]*"ok"\s*:\s*true)(?=[^\n]*"summary"\s*:\s*"Document read")'
    flags: m
    weight: 2
    arm: with-only
