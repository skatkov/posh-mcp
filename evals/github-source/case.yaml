schema_version: "1.1"
name: github-source
description: >
  The web route. Observed verbatim: github.com/sparklemotion/nokogiri/blob/v1.19.4/lib/
  nokogiri/xml/searchable.rb was fetched to answer a question POSH holds locally.
tags: [adoption, web]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    In the Nokogiri version this project locks, can I pass more than one CSS selector to
    Searchable#css, and how do I supply namespace bindings? Show a one-line example of each.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, WebFetch, mcp__plugin_posh_docs]
runs: 3
graders:
  - type: llm
    name: multiple-selectors-and-namespaces
    criteria: >
      States that css accepts one or more selectors as separate arguments, and that a hash of
      namespace bindings is appended as a trailing argument. Both examples are consistent with
      that signature.
    weight: 2
  - type: tool_order
    name: searched-before-reading
    before: mcp__plugin_posh_docs__search
    after:
      tool: mcp__plugin_posh_docs__read
      input_match: '"ref"\s*:\s*"(?:posh://)?gem:nokogiri/rdoc/Nokogiri/XML/Searchable\.md(?:#method-i-css)?"'
    arm: with-only
  - type: regex
    name: documentation-read-succeeded
    target: trace
    # Correlate fixture project, expected document, and successful result by tool ID.
    pattern: '^\{"type"\s*:\s*"system"[^\n]*"subtype"\s*:\s*"init"[^\n]*"cwd"\s*:\s*"([^"]+)"[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"assistant"[^\n]*\{"type"\s*:\s*"tool_use",\s*"id"\s*:\s*"([^"]+)",\s*"name"\s*:\s*"mcp__plugin_posh_docs__read",\s*"input"\s*:\s*\{(?=[^}\n]*"ref"\s*:\s*"(?:posh://)?gem:nokogiri/rdoc/Nokogiri/XML/Searchable\.md(?:#method-i-css)?")(?:(?=[^}\n]*"project"\s*:\s*"\1/?")|(?![^}\n]*"project"\s*:))[^}\n]*\}[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"user"[^\n]*"tool_use_id"\s*:\s*"\2"[^\n]*"structuredContent"\s*:\s*\{(?=[^\n]*"ref"\s*:\s*"(?:posh://)?gem:nokogiri/rdoc/Nokogiri/XML/Searchable\.md(?:#method-i-css)?")(?=[^\n]*"ok"\s*:\s*true)(?=[^\n]*"summary"\s*:\s*"Document read")'
    flags: m
    weight: 2
    arm: with-only
  - type: regex
    name: did-not-fetch-the-source-from-github
    target: trace
    pattern: 'githubusercontent\.com|github\.com/sparklemotion'
    match: not_contains
    arm: with-only
    weight: 1
