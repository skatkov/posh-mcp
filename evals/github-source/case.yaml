schema_version: "1.1"
name: github-source
description: >
  The web route. Observed verbatim: github.com/sparklemotion/nokogiri/blob/v1.19.4/lib/
  nokogiri/xml/searchable.rb was fetched to answer a question POSH holds locally.
tags: [adoption, web]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    In the Nokogiri version this project locks, can I pass more than one CSS selector to
    Searchable#css, and how do I supply namespace bindings? Show a one-line example of each.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, WebFetch, mcp__plugin_posh_docs]
runs: 3
graders:
  - type: llm
    name: multiple-selectors-and-namespaces
    criteria: >
      States that css accepts one or more selectors as separate arguments, and that a hash of
      namespace bindings is appended as a trailing argument. Both examples are consistent with
      that signature.
    weight: 2
  - type: regex
    name: read-nokogiri-docs-from-posh
    target: trace
    pattern: 'posh://gem:nokogiri'
    arm: with-only
    weight: 2
  - type: tool_order
    name: searched-before-reading
    before: mcp__plugin_posh_docs__search
    after: mcp__plugin_posh_docs__read
    arm: with-only
  - type: regex
    name: documentation-read-succeeded
    target: trace
    pattern: 'Document read'
    arm: with-only
  - type: regex
    name: did-not-fetch-the-source-from-github
    target: trace
    pattern: 'githubusercontent\.com|github\.com/sparklemotion'
    match: not_contains
    arm: with-only
    weight: 1
