schema_version: "1.1"
name: kamal-guide
description: >
  A configuration question whose answer lives in a guide, not in API docs. Observed path:
  reading kamal's installed source (6 calls) and fetching project READMEs over HTTP.
tags: [adoption, guide]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    I need to deploy this app to a private registry instead of Docker Hub, using the Kamal
    version this project locks. Which config keys do I set, and how do I keep the password
    out of the config file? Quote the YAML.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, WebFetch, mcp__plugin_posh_docs]
runs: 3
graders:
  - type: llm
    name: names-the-registry-keys
    criteria: >
      Shows a registry block in deploy.yml with server, username and password, and explains
      that the password entry names an environment variable or secret (for example
      KAMAL_REGISTRY_PASSWORD) rather than holding the password itself.
    weight: 2
  - type: tool_order
    name: searched-before-reading
    before: mcp__plugin_posh_docs__search
    after:
      tool: mcp__plugin_posh_docs__read
      input_match: '"ref"\s*:\s*"(?:posh://)?gem:kamal/guide/docs/configuration/docker-registry\.md(?:#[^"]+)?"'
    arm: with-only
  - type: regex
    name: documentation-read-succeeded
    target: trace
    # Correlate fixture project, expected document, and successful result by tool ID.
    pattern: '^\{"type"\s*:\s*"system"[^\n]*"subtype"\s*:\s*"init"[^\n]*"cwd"\s*:\s*"([^"]+)"[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"assistant"[^\n]*\{"type"\s*:\s*"tool_use",\s*"id"\s*:\s*"([^"]+)",\s*"name"\s*:\s*"mcp__plugin_posh_docs__read",\s*"input"\s*:\s*\{(?=[^}\n]*"ref"\s*:\s*"(?:posh://)?gem:kamal/guide/docs/configuration/docker-registry\.md(?:#[^"]+)?")(?:(?=[^}\n]*"project"\s*:\s*"\1/?")|(?![^}\n]*"project"\s*:))[^}\n]*\}[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"user"[^\n]*"tool_use_id"\s*:\s*"\2"[^\n]*"structuredContent"\s*:\s*\{(?=[^\n]*"ref"\s*:\s*"(?:posh://)?gem:kamal/guide/docs/configuration/docker-registry\.md(?:#[^"]+)?")(?=[^\n]*"ok"\s*:\s*true)(?=[^\n]*"summary"\s*:\s*"Document read")'
    flags: m
    weight: 2
    arm: with-only
