schema_version: "1.1"
name: hook-redirect
description: >
  The interception layer. The task points straight at vendored gem source, which is where
  ~200 observed tool calls went, and this copy's comment is wrong for the locked version.
  Passing means the PreToolUse hook turned the read into a POSH lookup and the answer came
  from the documentation rather than from the source in the repository.
tags: [interception, hook]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Start by locating relation.rb in the vendored Active Record tree under vendor/bundle.
    Then tell me about the upstream Active Record version locked in Gemfile.lock (not local
    modifications): when I call update_all on a relation, do validations and callbacks run,
    and is updated_at refreshed? Two sentences is enough.
  max_turns: 12
  timeout_seconds: 300
  allowed_tools: [Read, Grep, Glob, WebFetch, mcp__plugin_posh_docs]
runs: 3
graders:
  - type: regex
    name: hook-redirected-the-source-read
    target: trace
    pattern: 'POSH has local documentation for'
    arm: with-only
    weight: 2
  - type: llm
    name: answered-from-the-documentation-not-the-vendored-copy
    criteria: >
      States that update_all runs neither validations nor callbacks and does not update
      updated_at. An answer claiming that records are instantiated, that callbacks run, or
      that updated_at is refreshed fails: that is what the vendored file in the repository
      says, and it is wrong for the locked version.
    weight: 2
  - type: tool_order
    name: searched-before-reading
    before: mcp__plugin_posh_docs__search
    after:
      tool: mcp__plugin_posh_docs__read
      input_match: '"ref"\s*:\s*"(?:posh://)?gem:activerecord/rdoc/ActiveRecord/Relation\.md(?:#method-i-update_all)?"'
    arm: with-only
  - type: regex
    name: documentation-read-succeeded
    target: trace
    # Correlate fixture project, expected document, and successful result by tool ID.
    pattern: '^\{"type"\s*:\s*"system"[^\n]*"subtype"\s*:\s*"init"[^\n]*"cwd"\s*:\s*"([^"]+)"[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"assistant"[^\n]*\{"type"\s*:\s*"tool_use",\s*"id"\s*:\s*"([^"]+)",\s*"name"\s*:\s*"mcp__plugin_posh_docs__read",\s*"input"\s*:\s*\{(?=[^}\n]*"ref"\s*:\s*"(?:posh://)?gem:activerecord/rdoc/ActiveRecord/Relation\.md(?:#method-i-update_all)?")(?:(?=[^}\n]*"project"\s*:\s*"\1/?")|(?![^}\n]*"project"\s*:))[^}\n]*\}[^\n]*\n[\s\S]*?^\{"type"\s*:\s*"user"[^\n]*"tool_use_id"\s*:\s*"\2"[^\n]*"structuredContent"\s*:\s*\{(?=[^\n]*"ref"\s*:\s*"(?:posh://)?gem:activerecord/rdoc/ActiveRecord/Relation\.md(?:#method-i-update_all)?")(?=[^\n]*"ok"\s*:\s*true)(?=[^\n]*"summary"\s*:\s*"Document read")'
    flags: m
    weight: 2
    arm: with-only
