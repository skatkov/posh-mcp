schema_version: "1.1"
name: typo-control
description: >
  The over-triggering control, in a Ruby project so both the ruleset and the hook are active. Kept from POSH's own Le Mans bench: it passes only with zero
  POSH calls. A hook that denies tool calls can go wrong here in a way prose never could.
tags: [control, guard]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    There is a typo in README.md. Fix it and change nothing else.
  max_turns: 10
  timeout_seconds: 240
  allowed_tools: [Read, Grep, Glob, Edit, mcp__plugin_posh_docs]
runs: 3
graders:
  - type: regex
    name: typo-is-fixed
    target: { source: file, path: README.md }
    pattern: '^# Widget Reports\n\nA small Rails application that presses widgets and reports on them\.\n$'
    weight: 2
  - type: tool_used
    name: posh-search-not-used
    tool: mcp__plugin_posh_docs__search
    min: 0
    max: 0
    arm: both
    weight: 1
  - type: tool_used
    name: posh-read-not-used
    tool: mcp__plugin_posh_docs__read
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: posh-docsets-not-used
    tool: mcp__plugin_posh_docs__docsets
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: posh-list-not-used
    tool: mcp__plugin_posh_docs__list
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: posh-outline-not-used
    tool: mcp__plugin_posh_docs__outline
    min: 0
    max: 0
    arm: both
  - type: tool_used
    name: posh-sync-not-used
    tool: mcp__plugin_posh_docs__sync
    min: 0
    max: 0
    arm: both
